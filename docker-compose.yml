# Local Postgres for development. Production uses Neon; this exists so the
# migrations and seed can be run offline without touching the hosted database.
services:
  db:
    image: postgres:16-alpine
    container_name: expense_db
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
